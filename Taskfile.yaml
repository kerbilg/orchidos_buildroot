version: '3'

vars:
  DEFCONFIG: orchidos_x86_64_defconfig
  BR2_EXTERNAL: ../br2_external
  BUILDROOT_DIR: ./buildroot
  DOCKER_RUN: ./buildroot/utils/docker-run

tasks:
  default:
    cmds:
      - task --list
    silent: true

  menuconfig:
    desc: Buildroot Menuconfig starten
    cmds:
      - |
        {{.DOCKER_RUN}} bash -c "cd {{.BUILDROOT_DIR}} && \
          make BR2_EXTERNAL={{.BR2_EXTERNAL}} {{.DEFCONFIG}} && \
          make menuconfig"
    silent: true

  savedefconfig:
    desc: Änderungen in Defconfig speichern
    cmds:
      - |
        {{.DOCKER_RUN}} bash -c "cd {{.BUILDROOT_DIR}} && \
          make BR2_EXTERNAL={{.BR2_EXTERNAL}} \
            BR2_DEFCONFIG={{.BR2_EXTERNAL}}/configs/{{.DEFCONFIG}} \
            savedefconfig"
      - echo "✅ Defconfig gespeichert"
    silent: true

  build:
    desc: Vollständigen Build starten
    cmds:
      - |
        {{.DOCKER_RUN}} bash -c "cd {{.BUILDROOT_DIR}} && \
          make BR2_EXTERNAL={{.BR2_EXTERNAL}} {{.DEFCONFIG}} && \
          make"
      - echo "✅ Build abgeschlossen"
    silent: true

  clean:
    desc: Build-Artifakte löschen
    cmds:
      - |
        {{.DOCKER_RUN}} bash -c "cd {{.BUILDROOT_DIR}} && make clean"
      - echo "✅ Clean abgeschlossen"
    silent: true

  shell:
    desc: Shell im Docker-Container öffnen
    cmds:
      - |
        {{.DOCKER_RUN}} bash
    silent: true

  linux-menuconfig:
    desc: Linux Kernel Menuconfig öffnen
    cmds:
      - |
        {{.DOCKER_RUN}} bash -c "cd {{.BUILDROOT_DIR}} && \
          make BR2_EXTERNAL={{.BR2_EXTERNAL}} {{.DEFCONFIG}} && \
          make linux-menuconfig"
    silent: true

  linux-update-defconfig:
    desc: Linux-Kernel-Config dauerhaft speichern (in board/orchidos/linux.config)
    cmds:
      - |
        {{.DOCKER_RUN}} bash -c "cd {{.BUILDROOT_DIR}} && \
          make BR2_EXTERNAL={{.BR2_EXTERNAL}} linux-update-defconfig"
      - echo "✅ Linux Kernel Config gespeichert in board/orchidos/linux.config"
    silent: true

  linux-clean:
    desc: Linux Kernel Build-Artifakte löschen (zwingt Neukompilierung)
    cmds:
      - |
        {{.DOCKER_RUN}} bash -c "cd {{.BUILDROOT_DIR}} && \
          make BR2_EXTERNAL={{.BR2_EXTERNAL}} linux-clean"
      - echo "✅ Linux Kernel Clean abgeschlossen"
    silent: true